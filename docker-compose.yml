services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trikonos
      POSTGRES_USER: trikonos
      POSTGRES_PASSWORD: trikonos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trikonos -d trikonos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"  # web UI - http://localhost:8025 to see sent e-mails
      - "1025:1025"  # SMTP

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:
  media_data:
