{% extends "emails/base.html" %}
{% block content %}
<p>Dobrý den,</p>
<p>objednávka <strong>{{ order_number }}</strong> byla odeslána.</p>
<p>Dopravce: {{ carrier_name|default:"-" }}<br>Sledovací číslo: {{ tracking_number|default:"-" }}</p>
<p style="margin:24px 0;">

</p>
{% endblock %}
