<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ shop_name }}</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background:#f5f5f5; margin:0; padding:24px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:8px;">
    <tr>
      <td style="padding:32px;">
        <h1 style="font-size:20px; color:#111111; margin:0 0 20px;">{{ shop_name }}</h1>
        {% block content %}{% endblock %}
        <p style="color:#888888; font-size:12px; margin-top:32px; border-top:1px solid #eeeeee; padding-top:16px;">
          {{ shop_name }}{% if contact_email %} &middot; {{ contact_email }}{% endif %}
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
